<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP Disk Visualizer</title>
<style>
:root {
  --bg: #0c0f13; --panel: #12161c; --panel-2: #181d25; --line: #232a34; --line-2: #2d3541;
  --text: #e7eaef; --muted: #8b95a5; --dim: #5f6876; --accent: #5b9bff; --accent-soft: rgba(91,155,255,.14);
  --danger: #f2655f; --danger-soft: rgba(242,101,95,.13); --ok: #3fb984;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --panel-2: #f6f7f9; --line: #e2e5ea; --line-2: #d3d8df;
    --text: #1a1e24; --muted: #5d6675; --dim: #8b93a0; --accent: #2f6fe0; --accent-soft: rgba(47,111,224,.1);
    --danger: #d64541; --danger-soft: rgba(214,69,65,.09); color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand i { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 200deg, #e5534b, #ec8a3c, #d6a62a, #3fb984, #4c9be8, #8a63f2, #e5534b); display: inline-block; }
.brand small { font-weight: 500; color: var(--dim); }
.crumbs { flex: 1; display: flex; align-items: center; min-width: 0; overflow: hidden; gap: 2px; }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.crumbs button:hover { background: var(--panel-2); color: var(--text); }
.crumbs button:last-child { color: var(--text); font-weight: 600; }
.crumbs span { color: var(--dim); }
.disk { display: flex; flex-direction: column; gap: 4px; min-width: 190px; font-size: 11.5px; color: var(--muted); }
.disk .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.disk .meter b { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #8a63f2); }
.freed { color: var(--ok); font-weight: 600; font-size: 12px; white-space: nowrap; }
.tb { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); padding: 5px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--dim); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line-2)); background: var(--danger-soft); }
.btn.danger:hover { border-color: var(--danger); }
.btn.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }

main { flex: 1; display: flex; min-height: 0; }
#mapwrap { flex: 1; position: relative; min-width: 0; margin: 8px 0 8px 8px; border-radius: 8px; overflow: hidden; background: var(--panel); }
#mapwrap canvas { position: absolute; inset: 0; }
#ov { cursor: pointer; }
#tip { position: absolute; pointer-events: none; z-index: 5; background: rgba(12,15,19,.94); color: #e7eaef; border: 1px solid #2d3541; border-radius: 8px; padding: 8px 10px; max-width: 360px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: none; }
#tip .t { font-weight: 600; word-break: break-all; }
#tip .s { color: #9aa4b4; margin-top: 2px; }
#tip .p { color: #6f7887; font-family: var(--mono); font-size: 11px; margin-top: 4px; word-break: break-all; }

aside { width: 360px; display: flex; flex-direction: column; min-height: 0; padding: 8px; gap: 8px; }
.card { background: var(--panel); border-radius: 8px; border: 1px solid var(--line); }
#sel { padding: 14px; }
#sel .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); display: flex; align-items: center; gap: 6px; }
#sel .kind i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
#sel .name { font-size: 15px; font-weight: 650; margin-top: 6px; word-break: break-word; }
#sel .size { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
#sel .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
#sel .path { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 8px; word-break: break-all; }
#sel .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
#panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 550; }
.tabs button.on { background: var(--panel-2); color: var(--text); }
#list { flex: 1; overflow: auto; padding: 4px; }
.row { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 9px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: default; }
.row:hover { background: var(--panel-2); }
.row.on { background: var(--accent-soft); }
.row i { width: 10px; height: 10px; border-radius: 3px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sz { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.row .sub { grid-column: 2 / 4; font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.row .bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.row .bar b { display: block; height: 100%; border-radius: 2px; }
.empty { color: var(--dim); padding: 20px; text-align: center; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 8px 6px; gap: 1px; }
.section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding: 12px 8px 4px; }

footer { display: flex; gap: 16px; padding: 0 14px 8px; color: var(--dim); font-size: 11.5px; }
footer #hoverpath { flex: 1; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#scan { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; background: var(--panel); }
#scan .box { width: min(460px, 90%); text-align: center; }
#scan h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
#scan .where { font-family: var(--mono); color: var(--muted); font-size: 12px; word-break: break-all; }
#scan .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 16px; }
#scan .nums div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
#scan .nums b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
#scan .nums span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
#scan .cur { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; }
#scan .track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 14px; }
#scan .track b { display: block; width: 30%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

#menu { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: none; }
#menu button { display: flex; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 5px; text-align: left; cursor: pointer; justify-content: space-between; }
#menu button:hover { background: var(--accent-soft); }
#menu button.danger { color: var(--danger); }
#menu button kbd { color: var(--dim); font: 11px var(--font); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

#modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: none; place-items: center; }
#modal .dlg { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 20px; width: min(440px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
#modal h3 { margin: 0 0 10px; font-size: 15px; }
#modal .what { font-weight: 600; word-break: break-word; }
#modal .det { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; word-break: break-all; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
#modal .row2 { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 40; background: var(--panel); border: 1px solid var(--line-2); padding: 9px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: none; max-width: 80vw; }
#toast.err { border-color: var(--danger); color: var(--danger); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }

#clean { position: absolute; inset: 0; z-index: 4; background: var(--panel); display: none; flex-direction: column; }
#clBody { flex: 1; overflow: auto; padding: 20px 24px 28px; }
.cl-title { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.cl-sub { color: var(--muted); margin-top: 4px; }
.chips { display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; min-width: 150px; }
.chip:hover { border-color: var(--dim); }
.chip b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.chip span { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.cl-note { color: var(--dim); font-size: 12px; margin-top: 10px; }
.cl-sec { margin-top: 26px; }
.cl-sec h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.cl-sec h3 small { color: var(--muted); font-weight: 500; font-size: 13px; }
.cl-sec > p { margin: 3px 0 10px 16px; color: var(--muted); font-size: 12px; }
.grp { border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; overflow: hidden; }
.grp-h { display: grid; grid-template-columns: 18px 1fr auto 14px; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
.grp-h:hover { background: var(--panel-2); }
.grp-h .t { font-weight: 600; min-width: 0; }
.grp-h .t small { color: var(--dim); font-weight: 500; margin-left: 4px; }
.grp-h .sz { font-variant-numeric: tabular-nums; font-weight: 650; }
.grp-h .chev { color: var(--dim); transition: transform .15s; }
.grp.open .chev { transform: rotate(90deg); }
.grp-why { padding: 0 12px 10px 42px; color: var(--muted); font-size: 12px; }
.cmd { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); padding: 3px 4px 3px 8px; border-radius: 6px; color: var(--text); max-width: 100%; }
.cmd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lnk { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 5px; font-size: 12px; border-radius: 4px; white-space: nowrap; }
.lnk:hover { background: var(--accent-soft); }
.items { border-top: 1px solid var(--line); padding: 4px 0; }
.it { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 5px 12px; }
.it:hover { background: var(--panel-2); }
.it .pth { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.it .m { color: var(--dim); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.it .m b { color: var(--text); font-weight: 600; }
.it .acts { display: flex; gap: 2px; }
.tag { font-size: 10px; color: var(--dim); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; justify-self: center; }
.more { padding: 4px 12px 8px 38px; }
.cl-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.cl-bar .cnt { flex: 1; color: var(--muted); min-width: 160px; }
.cl-bar .cnt b { color: var(--text); }
.report-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); padding: 3px 8px; border-radius: 20px; white-space: nowrap; }

@media (max-width: 860px) {
  main { flex-direction: column; }
  #mapwrap { margin: 8px 8px 0; min-height: 55vh; }
  aside { width: auto; }
  .disk { display: none; }
}
</style>
</head>

<script>
(() => {
'use strict';
const CFG = window.TPDV || { mode: 'report', data: null };

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- formatting ----------
const fmt = b => {
  if (b < 1000) return b + ' B';
  const u = ['kB', 'MB', 'GB', 'TB', 'PB']; let i = -1;
  do { b /= 1000; i++; } while (b >= 1000 && i < u.length - 1);
  return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + ' ' + u[i];
};
const num = n => Math.round(n).toLocaleString();
const pct = (a, b) => b > 0 ? a / b * 100 : 0;
const HOME = (LIVE ? CFG.home : CFG.data && CFG.data.home) || '';
// tild shortens paths under the home folder to ~/… for display.
const tild = p => HOME && (p === HOME || p.startsWith(HOME + '/')) ? '~' + p.slice(HOME.length) : p;
const fmtPct = p => p >= 10 ? p.toFixed(0) + '%' : p >= 1 ? p.toFixed(1) + '%' : p > 0 ? '<1%' : '0%';

// ---------- file categories ----------
const CATS = {
  video:   { label: 'Video', color: '#e5534b', ext: 'mp4 mov m4v mkv avi wmv flv webm mpg mpeg 3gp mts m2ts vob braw r3d' },

const media = matchMedia('(prefers-color-scheme: dark)');

}
setTheme();

const palCache = new Map();

// ---------- data sources ----------
const api = LIVE ? {
  async get(u) {
    const r = await fetch(u, { headers: { 'X-TPDV-Token': CFG.token } });
    if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch {} throw new Error(m); }
    return r.json();
  },
  async post(u, body) {
    const r = await fetch(u, { method: 'POST', headers: { 'X-TPDV-Token': CFG.token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok || j.error) throw new Error(j.error || r.statusText);
    return j;
  },
  status() { return this.get('/api/status'); },
  tree(id) { return this.get('/api/tree' + (id == null ? '' : '?id=' + id)); },
  top(id) { return this.get('/api/top?n=300&id=' + id); },
  types() { return this.get('/api/types'); },
  action(op, id) { return this.post('/api/action', { op, id }); },
  suggest() { return this.get('/api/suggest'); },
  trashMany(ids) { return this.post('/api/trash', { ids }); },
} : reportApi(CFG.data);

function reportApi(data) {
  const idx = new Map(), parent = new Map();
  (function walk(n) { if (n.i >= 0) idx.set(n.i, n); if (n.k) for (const c of n.k) { parent.set(c, n); walk(c); } })(data.tree);
  const chain = n => { const out = []; for (let x = n; x; x = parent.get(x)) out.unshift(x); return out; };
  const join = ns => ns.map(x => x.n).reduce((a, b) => a.endsWith('/') ? a + b : a + '/' + b);
  return {
    async status() { return { scanning: false, info: data.info, freed: 0 }; },
    async tree(id) {
      const n = id == null ? data.tree : idx.get(id);
      if (!n) throw new Error('Not included in this report');
      const c = chain(n);
      return { path: join(c), crumbs: c.map(x => ({ i: x.i, n: x.n })), node: n, total: data.tree.s };
    },
    async top(id) {
      const n = idx.get(id);
      if (!n || n === data.tree) return data.top;
      const p = join(chain(n)), pre = p.endsWith('/') ? p : p + '/';
      return data.top.filter(f => (f.p + '/').startsWith(pre));
    },
    async types() { return data.types; },
    async suggest() { return { items: data.suggest || [], home: data.home || '' }; },
  };
}

// ---------- state ----------
const S = { view: null, path: '', crumbs: [], total: 0, parent: new Map(), sel: null, hover: null, tab: 'contents', top: null, types: null, info: null, freed: 0 };

// go shows folder id (null = scan root) and selects selId if it is visible.
async function go(id, selId) {

    S.sel = (selId != null && selId >= 0 && findById(selId)) || S.view;

  } catch (e) { toast(e.message, true); return false; }
}
function findById(id) {
  let hit = null;
  (function walk(n) { if (hit) return; if (n.i === id) { hit = n; return; } if (n.k) n.k.forEach(walk); })(S.view);
  return hit;
}
function pathOf(n) {
  if (n.p != null) return (n.p.endsWith('/') ? n.p : n.p + '/') + n.n; // top-files item
  const names = [];

const actionable = n => n && n.i >= 0;
const isDir = n => n && n.t === 1;
const isScanRoot = n => n === S.view && S.crumbs.length === 1;

// ---------- treemap ----------
const wrap = $('#mapwrap'), cv = $('#map'), ov = $('#ov');
const ctx = cv.getContext('2d'), octx = ov.getContext('2d');
let W = 0, H = 0, DPR = 1, rects = [], drawQueued = false;

function resize() {
  DPR = window.devicePixelRatio || 1; W = wrap.clientWidth; H = wrap.clientHeight;
  for (const c of [cv, ov]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); c.style.width = W + 'px'; c.style.height = H + 'px'; }
  draw();
}
new ResizeObserver(() => { if (!drawQueued) { drawQueued = true; requestAnimationFrame(() => { drawQueued = false; resize(); }); } }).observe(wrap);

// Squarified treemap (Bruls, Huizing, van Wijk). items sorted by size desc.
function squarify(items, x, y, w, h) {
  const out = [];
  let total = 0; for (const it of items) total += it.s;
  if (total <= 0 || w <= 0 || h <= 0) return out;
  const scale = w * h / total;
  let i = 0;
  while (i < items.length && w > 0.5 && h > 0.5) {
    const side = Math.min(w, h), s2 = side * side;
    const row = []; let sum = 0, best = Infinity;
    while (i < items.length) {
      const a = items[i].s * scale;
      if (a <= 0) { i++; continue; }
      const ns = sum + a, ns2 = ns * ns;
      const big = row.length ? row[0].a : a;
      const worst = Math.max(s2 * big / ns2, ns2 / (s2 * a));
      if (row.length && worst > best) break;
      row.push({ n: items[i], a }); sum = ns; best = worst; i++;
    }
    if (!row.length) break;
    if (w >= h) {
      const cw = sum / h; let cy = y;
      for (const r of row) { const rh = r.a / cw; out.push({ n: r.n, x, y: cy, w: cw, h: rh }); cy += rh; }
      x += cw; w -= cw;
    } else {
      const rh = sum / w; let cx = x;
      for (const r of row) { const rw = r.a / rh; out.push({ n: r.n, x: cx, y, w: rw, h: rh }); cx += rw; }
      y += rh; h -= rh;
    }
  }
  return out;
}

const FONT = '11px ' + getComputedStyle(document.body).fontFamily;
const FONT_B = '600 ' + FONT;
function fit(c, s, w) {
  if (w < 10) return '';
  if (c.measureText(s).width <= w) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (c.measureText(s.slice(0, m) + '…').width <= w) lo = m; else hi = m - 1; }
  return lo ? s.slice(0, lo) + '…' : '';
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  rects = [];
  if (S.view && W > 0 && H > 0) {
    ctx.textBaseline = 'middle';
    node(S.view, 0, 0, W, H, 0);
  }
  overlay();
}

function node(n, x, y, w, h, d) {
  const x0 = Math.round(x), y0 = Math.round(y), x1 = Math.round(x + w), y1 = Math.round(y + h);
  const rw = x1 - x0, rh = y1 - y0;
  if (rw < 1 || rh < 1) return;
  rects.push({ n, x: x0, y: y0, w: rw, h: rh });
  if (n.t !== 1) return leaf(n, x0, y0, rw, rh);

  ctx.fillStyle = TH.dir(d);
  ctx.fillRect(x0, y0, rw, rh);
  let hdr = 0;
  if (d > 0 && rh >= 32 && rw >= 44) {
    hdr = 17;
    ctx.font = FONT_B; ctx.fillStyle = TH.hdr;
    const name = fit(ctx, n.n, rw - 10);
    ctx.fillText(name, x0 + 5, y0 + 9);
    const nw = ctx.measureText(name).width;
    ctx.font = FONT; ctx.fillStyle = TH.hdrDim;
    const sz = fmt(n.s);
    if (nw + ctx.measureText(sz).width + 18 < rw) ctx.fillText(sz, x0 + 11 + nw, y0 + 9);
  }
  const pad = d > 0 ? 2 : 1;
  const ix = x0 + pad, iy = y0 + (hdr || pad), iw = rw - pad * 2, ih = rh - (hdr || pad) - pad;
  if (n.k && n.k.length) {
    if (iw >= 2 && ih >= 2) for (const r of squarify(n.k, ix, iy, iw, ih)) node(r.n, r.x, r.y, r.w, r.h, d + 1);
  } else if (n.h && iw > 4 && ih > 4) {
    ctx.fillStyle = TH.rest; ctx.fillRect(ix, iy, iw, ih);
    if (iw > 60 && ih > 16) { ctx.font = FONT; ctx.fillStyle = TH.pseudoText; ctx.fillText(fit(ctx, 'double-click to open', iw - 10), ix + 5, iy + ih / 2); }
  }
}

function leaf(n, x, y, w, h) {
  const gw = w > 2 ? w - 1 : w, gh = h > 2 ? h - 1 : h;
  const col = colorOf(n);
  if (n.t === 0 && gw * gh > 300) {
    const p = pal(col), g = ctx.createLinearGradient(x, y, x + gw * .6, y + gh);
    g.addColorStop(0, p.hi); g.addColorStop(1, p.lo);
    ctx.fillStyle = g;
  } else ctx.fillStyle = col;
  ctx.fillRect(x, y, gw, gh);
  if (gw > 46 && gh > 16) {
    const pseudo = n.t >= 2;
    ctx.font = FONT_B; ctx.fillStyle = pseudo ? TH.pseudoText : TH.leafText;
    ctx.fillText(fit(ctx, n.n, gw - 10), x + 5, y + 10);
    if (gh > 31) { ctx.font = FONT; ctx.fillStyle = pseudo ? TH.hdrDim : TH.leafDim; ctx.fillText(fmt(n.s), x + 5, y + 24); }
  }
}

function rectOf(n) { for (let i = rects.length - 1; i >= 0; i--) if (rects[i].n === n) return rects[i]; return null; }
function hit(mx, my) {
  for (let i = rects.length - 1; i >= 0; i--) { const r = rects[i]; if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) return r; }

}
function overlay() {
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);

}

const tip = $('#tip');

  );

function renderList() {

function confirmTrash(n) { return confirmDlg('Move to Trash?', `${n.n} — ${fmt(n.s)}`, tild(pathOf(n))); }
function confirmDlg(title, what, det) {
  return new Promise(res => {
    $('#mTitle').textContent = title;
    $('#mWhat').textContent = what;
    $('#mDet').textContent = det;
    const m = $('#modal'); m.style.display = 'grid';
    const done = v => { m.style.display = 'none'; removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } if (e.key === 'Enter') { e.stopPropagation(); done(true); } };
    addEventListener('keydown', key, true);
    $('#mNo').onclick = () => done(false);
    $('#mYes').onclick = () => done(true);
    $('#mYes').focus();
  });
}
async function trash(n) {
  if (!LIVE || !actionable(n) || isScanRoot(n)) return;
  if (!(await confirmTrash(n))) return;
  try {
    const r = await api.action('trash', n.i);
    toast(`Moved “${n.n}” to Trash · freed ${fmt(r.freed || n.s)}`);
    const ci = S.crumbs.findIndex(c => c.i === n.i);
    await go(ci > 0 ? S.crumbs[ci - 1].i : S.view.i);
    C.items = null;
    refreshStatus();
  } catch (e) { toast('Could not move to Trash: ' + e.message, true); }
}
async function rescan(n) {
  if (!LIVE) return;
  const target = n || S.view;
  const btn = $('#rescanBtn'); btn.disabled = true; btn.textContent = '↻ Scanning…';
  try {
    const r = await api.action('rescan', target.i);
    if (target === S.view) await go(r.id); else await go(S.view.i, S.sel && S.sel.i);
    C.items = null;
    refreshStatus(); toast('Rescanned ' + target.n);
  } catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = '↻ Rescan';
}

// ---------- clean-up suggestions ----------
const SAFETY = [
  { k: 'safe', label: 'Safe to delete', sub: 'Caches and build output. Recreated automatically.', color: 'var(--ok)' },
  { k: 'rebuild', label: 'Rebuildable', sub: 'Recreated by reinstalling, rebuilding or re-downloading. Costs time, not data.', color: 'var(--accent)' },
  { k: 'review', label: 'Review first', sub: 'May hold things you want. Look before deleting.', color: '#d6a62a' },
];
const C = { open: false, items: null, sel: new Set(), expanded: new Set() };
const sum = xs => xs.reduce((a, x) => a + x.s, 0);
const canTrash = it => LIVE && !it.noTrash;
function ago(t) {
  if (!t) return '';
  const d = (Date.now() / 1000 - t) / 86400;
  if (d < 1) return 'today';
  if (d < 45) return Math.round(d) + 'd ago';
  if (d < 540) return Math.round(d / 30) + ' mo ago';
  return (d / 365).toFixed(1) + ' yr ago';
}

async function openClean() {
  C.open = true; $('#clean').style.display = 'flex'; $('#cleanBtn').classList.add('on');
  tip.style.display = 'none';
  if (C.items) return renderClean();
  $('#clBody').replaceChildren(el('div', 'empty', 'Looking for caches and build folders…'));
  try {
    const r = await api.suggest();
    C.items = r.items || [];
    const ids = new Set(C.items.map(i => i.i));
    C.sel = new Set([...C.sel].filter(id => ids.has(id)));
    renderClean();
  } catch (e) { toast(e.message, true); }
}
function closeClean() { C.open = false; $('#clean').style.display = 'none'; $('#cleanBtn').classList.remove('on'); }

function groupsOf(level) {
  const map = new Map();
  for (const it of C.items) {
    if (it.safety !== level) continue;
    let g = map.get(it.title);
    if (!g) map.set(it.title, g = { key: level + '|' + it.title, title: it.title, why: it.why, cmd: it.cmd, items: [] });
    g.items.push(it);
  }
  return [...map.values()].map(g => ({ ...g, s: sum(g.items) })).sort((a, b) => b.s - a.s);
}

function renderClean() {
  const body = $('#clBody'), items = C.items || [];
  const scroll = body.scrollTop;
  body.replaceChildren();
  const root = S.crumbs[0]?.n || '';
  body.append(el('h2', 'cl-title', 'Clean-up suggestions'));
  body.append(el('div', 'cl-sub', items.length
    ? `Up to ${fmt(sum(items))} can be freed in ${tild(root)}. Nothing is deleted until you confirm.`
    : `Nothing obvious to clean in ${tild(root)}.`));

  const chips = el('div', 'chips');
  for (const lv of SAFETY) {
    const its = items.filter(i => i.safety === lv.k);
    if (!its.length) continue;
    const c = el('button', 'chip'), lab = el('span'), dot = el('i', 'dot');
    dot.style.background = lv.color; lab.append(dot, lv.label + ` · ${its.length}`);
    c.append(el('b', null, fmt(sum(its))), lab);
    c.onclick = () => document.getElementById('sec-' + lv.k)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    chips.append(c);
  }
  body.append(chips);
  if (root !== HOME && root !== '/') body.append(el('div', 'cl-note', 'Only this folder was checked. Scan your home folder (tpdv ~) to also find app caches, Xcode data and package-manager caches.'));

  for (const lv of SAFETY) {
    const groups = groupsOf(lv.k);
    if (!groups.length) continue;
    const sec = el('section', 'cl-sec'); sec.id = 'sec-' + lv.k;
    const h = el('h3'), dot = el('i', 'dot'); dot.style.background = lv.color;
    h.append(dot, lv.label, el('small', null, fmt(sum(groups))));
    sec.append(h, el('p', null, lv.sub));
    for (const g of groups) sec.append(groupCard(g));
    body.append(sec);
  }
  body.scrollTop = scroll;
  renderCleanBar();
}

function groupCard(g) {
  const open = C.expanded.has(g.key);
  const card = el('div', 'grp' + (open ? ' open' : ''));
  const head = el('div', 'grp-h');
  const trashable = g.items.filter(canTrash);
  if (trashable.length) {
    const cb = el('input'); cb.type = 'checkbox';
    const n = trashable.filter(i => C.sel.has(i.i)).length;
    cb.checked = n === trashable.length; cb.indeterminate = n > 0 && n < trashable.length;
    cb.onclick = e => { e.stopPropagation(); for (const i of trashable) cb.checked ? C.sel.add(i.i) : C.sel.delete(i.i); renderClean(); };
    head.append(cb);
  } else head.append(el('span'));
  const t = el('div', 't', g.title); if (g.items.length > 1) t.append(el('small', null, `${g.items.length} folders`));
  head.append(t, el('div', 'sz', fmt(g.s)), el('div', 'chev', '›'));
  head.onclick = () => { open ? C.expanded.delete(g.key) : C.expanded.add(g.key); renderClean(); };
  card.append(head);

  const why = el('div', 'grp-why', g.why);
  if (g.cmd) {
    const cmd = el('div', 'cmd'); const cp = el('button', 'lnk', 'Copy');
    cp.onclick = () => copy(g.cmd, 'Command copied');
    cmd.append(el('span', null, g.cmd), cp);
    why.append(el('br'), cmd);
  }
  card.append(why);
  if (!open) return card;

  const list = el('div', 'items');
  for (const it of g.items.slice(0, 300)) list.append(itemRow(it));
  if (g.items.length > 300) list.append(el('div', 'more cl-note', `… ${g.items.length - 300} more (select the group to include them all)`));
  card.append(list);
  return card;
}

function itemRow(it) {
  const row = el('div', 'it');
  if (canTrash(it)) {
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = C.sel.has(it.i);
    cb.onchange = () => { cb.checked ? C.sel.add(it.i) : C.sel.delete(it.i); renderClean(); };
    row.append(cb);
  } else row.append(el('span', LIVE ? 'tag' : null, LIVE ? 'cmd' : ''));
  if (LIVE && it.noTrash) row.title = 'Clean this with the command above, not the Trash';
  row.append(el('div', 'pth', '‎' + tild(it.p)));
  const meta = el('div', 'm'); meta.append(el('b', null, fmt(it.s)));
  const extra = [it.d && it.f ? num(it.f) + ' files' : '', it.mtime ? 'project ' + ago(it.mtime) : ''].filter(Boolean).join(' · ');
  if (extra) meta.append(' · ' + extra);
  row.append(meta);
  const acts = el('div', 'acts');
  const mapBtn = el('button', 'lnk', 'Show'); mapBtn.title = 'Show in the treemap';
  mapBtn.onclick = async () => { closeClean(); await go(it.pi >= 0 ? it.pi : it.i, it.i); };
  acts.append(mapBtn);
  if (LIVE) { const rv = el('button', 'lnk', 'Reveal'); rv.onclick = () => act('reveal', { i: it.i }); acts.append(rv); }
  row.append(acts);
  return row;
}

function renderCleanBar() {
  const bar = $('#clBar'); bar.replaceChildren();
  if (!LIVE) { bar.append(el('div', 'cnt', 'Read-only report. Run tpdv on this Mac to clean up.')); return; }
  const chosen = (C.items || []).filter(i => C.sel.has(i.i));
  const cnt = el('div', 'cnt');
  if (chosen.length) cnt.append(el('b', null, `${chosen.length} selected`), ` · ${fmt(sum(chosen))}`);
  else cnt.append('Select folders to move them to the Trash. You can restore them with Put Back.');
  const safe = el('button', 'btn', 'Select all safe');
  safe.onclick = () => { for (const i of C.items) if (i.safety === 'safe' && canTrash(i)) C.sel.add(i.i); renderClean(); };
  const clear = el('button', 'btn', 'Clear'); clear.disabled = !chosen.length;
  clear.onclick = () => { C.sel.clear(); renderClean(); };
  const go_ = el('button', 'btn solid-danger', 'Move to Trash…'); go_.disabled = !chosen.length;
  go_.onclick = () => trashSelected(chosen);
  const back = el('button', 'btn', 'Back to treemap'); back.onclick = closeClean;
  bar.append(cnt, back, safe, clear, go_);
}

async function trashSelected(chosen) {
  const list = chosen.slice(0, 6).map(i => '• ' + tild(i.p)).join('\n') + (chosen.length > 6 ? `\n… and ${chosen.length - 6} more` : '');
  if (!(await confirmDlg(`Move ${chosen.length} item${chosen.length > 1 ? 's' : ''} to Trash?`, `${fmt(sum(chosen))} will be freed`, list))) return;
  try {
    const r = await api.trashMany(chosen.map(i => i.i));
    if (r.failed && r.failed.length) toast(`Moved ${r.trashed}, ${r.failed.length} failed: ${tild(r.failed[0].p)} — ${r.failed[0].error}`, true);
    else toast(`Moved ${r.trashed} items to Trash · freed ${fmt(r.freed)}`);
    C.sel.clear(); C.items = null;
    if (!(await go(S.view.i))) await go(null);
    refreshStatus();
    if (C.open) openClean();
  } catch (e) { toast('Could not move to Trash: ' + e.message, true); }
}
$('#cleanBtn').onclick = () => C.open ? closeClean() : openClean();

let toastTimer;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', err ? 6000 : 3000);
}

$('#upBtn').onclick = goUp;
$('#rescanBtn').onclick = () => rescan();
$('#reportBtn').onclick = () => { location.href = '/api/report?t=' + encodeURIComponent(CFG.token); };
if (!LIVE) document.querySelectorAll('.live').forEach(b => b.remove());

addEventListener('keydown', e => {
  if ($('#modal').style.display === 'grid' || e.target.tagName === 'INPUT') return;
  if (C.open) { if (e.key === 'Escape') closeClean(); return; }
  if (e.key === 'Escape') { hideMenu(); if (S.sel !== S.view) select(S.view); return; }
  if (e.key === 'Backspace' && !e.metaKey) { e.preventDefault(); goUp(); }
  if (e.key === 'Enter' && isDir(S.sel) && S.sel !== S.view && actionable(S.sel)) go(S.sel.i);
  if ((e.key === 'Delete' || (e.key === 'Backspace' && e.metaKey)) && S.sel && S.sel !== S.view) { e.preventDefault(); trash(S.sel); }
});

// ---------- boot ----------
async function refreshStatus() {
  try { const s = await api.status(); renderInfo(s.info, s.freed); } catch {}
}
// loaded shows the scan root; #clean in the URL opens the Clean up view.
async function loaded() {
  await go(null);
  if (location.hash === '#clean') openClean();
}
async function boot() {
  if (!LIVE) {
    if (!CFG.data) { $('#list').append(el('div', 'empty', 'No data.')); return; }
    renderInfo(CFG.data.info, 0);
    return loaded();
  }
  const scanBox = $('#scan');
  let shown = false;
  for (;;) {
    let s;
    try { s = await api.status(); } catch (e) { $('#scanTitle').textContent = 'Lost connection to tpdv'; $('#scanCur').textContent = e.message; scanBox.style.display = 'grid'; return; }
    if (s.error) { $('#scanTitle').textContent = 'Scan failed'; $('#scanCur').textContent = s.error; scanBox.style.display = 'grid'; return; }
    if (!s.scanning) { scanBox.style.display = 'none'; renderInfo(s.info, s.freed); return loaded(); }
    if (!shown) { scanBox.style.display = 'grid'; shown = true; }
    const p = s.progress || {};
    $('#scanFiles').textContent = num(p.files || 0);
    $('#scanBytes').textContent = fmt(p.bytes || 0);
    $('#scanRate').textContent = p.elapsedMs ? num(p.files / (p.elapsedMs / 1000)) : '0';
    $('#scanCur').textContent = '‎' + tild(p.current || '');
    await new Promise(r => setTimeout(r, 250));
  }
}
boot();
})();
</script>
</body>
